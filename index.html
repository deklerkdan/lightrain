<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streams</title>
<meta name="theme-color" content="#f2f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streams">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Same layout as the EcoFest and CCAN briefing pages, for one person. */
:root {
  --ground: #f2f4f5; --paper: #ffffff; --ink: #172128; --muted: #5d6b73; --line: #d6dde1;
  --accent: #2f6a86; --accent-soft: #e1edf3; --warm: #a9601a; --warm-soft: #f8ecdd;
  --done: #2e7d4f; --done-soft: #e3f2e8; --quiet: #7d8589; --quiet-soft: #eceeef;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light; --s: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10161a; --paper: #182127; --ink: #e2eaee; --muted: #9eb0b9; --line: #2a3840;
    --accent: #6cb8d6; --accent-soft: #1a3340; --warm: #e2a057; --warm-soft: #3a2a18;
    --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e989c; --quiet-soft: #232c31; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10161a; --paper: #182127; --ink: #e2eaee; --muted: #9eb0b9; --line: #2a3840;
  --accent: #6cb8d6; --accent-soft: #1a3340; --warm: #e2a057; --warm-soft: #3a2a18;
  --done: #6fcf95; --done-soft: #1b3326; --quiet: #8e989c; --quiet-soft: #232c31; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: calc(16px * var(--s)); line-height: 1.55;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left)); }
a { color: var(--accent); }
button, input, textarea, select { font-family: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font-size: calc(12px * var(--s)); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(30px, 6vw, 42px) * var(--s)); line-height: 1.08; margin: 6px 0 0; text-wrap: balance; }
h1 em { font-style: italic; color: var(--accent); }
h2 { font-family: var(--f-display); font-weight: 500; font-size: calc(24px * var(--s)); margin: 0 0 10px; text-wrap: balance; }
.small { font-size: calc(13px * var(--s)); color: var(--muted); }
.muted { color: var(--muted); }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.error { background: var(--warm-soft); color: var(--warm); border-radius: 8px; padding: 12px 14px; font-size: calc(14px * var(--s)); }
.switch { border: 0; background: none; color: var(--accent); font-size: calc(14px * var(--s)); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.switch.warn { color: var(--warm); }

.nav { display: flex; gap: 8px; }
.nav button { flex: 1 1 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.nav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }

.gist { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.gist li { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.gist li:last-child { border-bottom: 0; padding-bottom: 0; }
.gist .k { font-weight: 700; font-size: calc(14px * var(--s)); color: var(--accent); padding-top: 2px; }
.gist .k.late { color: var(--warm); }
.gist .v { min-width: 0; }
.gist .v b { font-weight: 700; }
@media (max-width: 480px) { .gist li { grid-template-columns: 1fr; } }

.part { display: grid; gap: 14px; }
.part-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.part-head h2 { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: calc(13px * var(--s)); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ico svg { width: 1.2em; height: 1.2em; }
.legend .lt { opacity: .55; }

/* the card (same as the briefing pages) */
.ask { --kc: var(--accent); position: relative; display: grid; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-left: 16px solid var(--wc, var(--quiet)); border-radius: 10px; padding: 26px 16px 16px 14px; }
.flag { position: absolute; top: -1px; right: 14px; background: var(--kc); color: var(--paper); font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .03em; padding: 4px 11px 5px; border-radius: 0 0 8px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.k-ask .flag { opacity: .55; }
.wsname { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 700; color: var(--ink); }
.wsname i { width: 12px; height: 12px; border-radius: 3px; background: var(--wc, var(--quiet)); display: inline-block; }
.wsname .from { font-weight: 500; color: var(--muted); }
.ask-h { font-size: calc(18px * var(--s)); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.ask-text { font-size: calc(15px * var(--s)); overflow-wrap: anywhere; margin-top: -2px; }
.optional { font-size: calc(13px * var(--s)); color: var(--muted); font-style: italic; font-weight: 400; }
.ask-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: calc(14px * var(--s)); color: var(--muted); }
.ask-meta .late { color: var(--warm); font-weight: 700; }
.ask-link { font-size: calc(14px * var(--s)); }
.ask-link a { font-weight: 600; overflow-wrap: anywhere; }
.resp { display: flex; flex-wrap: wrap; gap: 8px; }
.resp button { border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: calc(14px * var(--s)); font-weight: 600; padding: 8px 13px; border-radius: 6px; cursor: pointer; }
.resp button:hover { border-color: var(--muted); }
.resp button.pri { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.answered { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: calc(14px * var(--s)); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.done { background: var(--done-soft); color: var(--done); }
.chip.team { background: var(--accent-soft); color: var(--accent); }
.chip.cant { background: var(--warm-soft); color: var(--warm); }
.chip.hold { background: var(--quiet-soft); color: var(--quiet); }
.tag { display: inline-block; font-size: calc(12px * var(--s)); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--accent); color: var(--paper); justify-self: start; }
.ask.featured { outline: 3px solid var(--accent); outline-offset: 1px; }
.ask.resting { opacity: .8; }
.extras { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 8px; }
.moves { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.moves .lab { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.moves button { border: 1.5px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: calc(13px * var(--s)); font-weight: 600; cursor: pointer; }
.moves button:hover { border-color: var(--accent); }
.moves button.star[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.snooze-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.snooze-row input[type=date] { font-size: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.stack { display: grid; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.none { color: var(--muted); }

details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; flex: 1; }
details.fold > summary .cnt { font-weight: 700; background: var(--accent); color: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: calc(14px * var(--s)); }
details.fold > summary::after { content: ""; display: inline-block; width: .55em; height: .55em; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-135deg); margin: 0 6px 0 0; font-size: calc(16px * var(--s)); }
details.fold:not([open]) > summary::after { transform: rotate(45deg); }
:root[data-labels="words"] details.fold > summary::after { content: "Fold away \25B4"; width: auto; height: auto; border: 0; transform: none; margin: 0; color: var(--accent); font-weight: 600; font-size: calc(13px * var(--s)); white-space: nowrap; }
:root[data-labels="words"] details.fold:not([open]) > summary::after { content: "Open \25BE"; }
details.fold > .fold-body { display: grid; gap: 14px; margin-top: 12px; }
.infobtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px; border-radius: 50%; justify-self: start; }
.infobtn[aria-expanded="true"] { background: var(--accent-soft); }
.infobtn .ico svg { width: 1.5em; height: 1.5em; }

.busy { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; padding: 10px 12px; pointer-events: none; }
.busy .pill { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 16px; display: inline-flex; gap: 10px; align-items: center; font-weight: 600; font-size: calc(14px * var(--s)); box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: 100%; }
.busy .leaf { display: inline-block; transform-origin: 50% 90%; animation: sway 1s ease-in-out infinite; }
.busy .trail { position: absolute; top: 0; left: 0; height: 4px; width: 35%; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg) scale(1.15); } }
@keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }

.bar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: center; font-size: calc(14px * var(--s)); }
.bar-row .nm { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.bar-row .nm i { width: 10px; height: 10px; border-radius: 3px; background: var(--wc); }
.track { height: 8px; background: var(--quiet-soft); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--wc, var(--accent)); border-radius: 4px; }
.btn { display: inline-block; background: var(--accent); color: var(--paper); font-weight: 700; text-decoration: none; padding: 12px 18px; border-radius: 6px; border: 0; cursor: pointer; font-size: calc(15px * var(--s)); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:disabled { opacity: .6; cursor: wait; }

/* add page and the edit form */
.addrow { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: calc(12px * var(--s)); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; font-size: calc(15px * var(--s)); padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); }
.field input.hd { font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.toggle button { border: 0; background: var(--ground); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 9px 18px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.plus { border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-size: calc(15px * var(--s)); font-weight: 700; padding: 12px 16px; border-radius: 10px; cursor: pointer; width: 100%; }
.checkline { display: inline-flex; gap: 8px; align-items: center; font-size: calc(15px * var(--s)); }
.checkline input { width: 18px; height: 18px; margin: 0; }

/* planning overview */
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { flex: 1 1 110px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-size: calc(26px * var(--s)); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: calc(13px * var(--s)); color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: calc(14px * var(--s)); max-width: calc(100% - 32px); z-index: 10; display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }

.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.tools button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; min-width: 44px; min-height: 40px; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
.tools button:disabled { opacity: .4; cursor: default; }

/* share / QR */
.modal-back { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,14,.6); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.modal { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); margin: auto; }
.modal h2 { margin: 0; }
.modal .qr { background: #fff; border-radius: 10px; padding: 8px; width: min(100%, 260px); margin: 0 auto; line-height: 0; }
.modal .qr svg { width: 100%; height: auto; display: block; }
.modal .check { font-size: calc(13px * var(--s)); color: var(--warm); background: var(--warm-soft); border-radius: 6px; padding: 6px 10px; margin: 0; }
.modal .app-note { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: calc(14px * var(--s)); display: grid; gap: 6px; }
.modal .app-note ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.modal .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* one card at a time */
.view-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.view-row .toggle button { padding: 7px 14px; font-size: calc(14px * var(--s)); }
.sortpick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sortpick select { font-size: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.deck { display: grid; gap: 10px; }
.deck-track { display: flex; align-items: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; border-radius: 10px; }
.deck-track::-webkit-scrollbar { display: none; }
.deck-slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; padding: 4px 1px 1px; }
.deck-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.deck-nav button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: calc(15px * var(--s)); font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; min-width: 96px; }
.deck-nav button:disabled { opacity: .4; cursor: default; }
.deck-count { font-weight: 700; font-size: calc(14px * var(--s)); font-variant-numeric: tabular-nums; }
.deck-dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.deck-dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
.deck-dots button[aria-current="true"] { background: var(--accent); transform: scale(1.3); }

.ico { display: inline-flex; vertical-align: middle; line-height: 0; }
.ico svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.flag .ico svg { width: 1.6em; height: 1.45em; }
.nav button .ico svg, .deck-nav button .ico svg { width: 1.5em; height: 1.5em; }
.toggle button .ico svg, .tools button .ico svg { width: 1.35em; height: 1.35em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .busy .leaf, .busy .trail { animation: none; } }
</style>
</head>
<body>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx3B2jZwZ33yQZ4MDTIReCe1GN8KnaCvuVybSaOZ7C_7dfIBHvMWmd-ZBjY6NFuaH6LnQ/exec';
const PFX = 'streams';
const app = document.getElementById('app');

/* ------------------------------------------------ the private key: arrives once in ?k=, then stays on this device */
let KEY = '';
try {
  const q = new URLSearchParams(location.search).get('k');
  if (q) { localStorage.setItem(PFX + 'Key', q); history.replaceState(null, '', location.pathname + location.hash); }
  KEY = localStorage.getItem(PFX + 'Key') || localStorage.getItem('streamsKey') || '';
} catch (e) { KEY = new URLSearchParams(location.search).get('k') || ''; }

let D = null;   // the last answer from the sheet, kept on the device so the page opens at once
try { D = JSON.parse(localStorage.getItem(PFX + 'Data2') || 'null'); } catch (e) {}
const viewFromHash = () => (location.hash === '#add' ? 'add' : location.hash === '#plan' ? 'plan' : 'home');
let VIEW = viewFromHash();
let editFor = '', snoozeFor = '';
let addRows = [];

function el(tag, props, kids) {
  const n = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v;
    else if (k === 'value') n.value = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  });
  [].concat(kids || []).forEach(c => { if (c !== null && c !== undefined && c !== '') n.append(c); });
  return n;
}

/* ------------------------------------------------ projects and their colours */
const COLOURS = { CCAN: '#2b9a3d', Woven: '#ae3ec9', KP: '#e8590c', EcoFest: '#0c8599', PS: '#1c6fd1', Lightrain: '#d49b00' };
const SPARE = ['#d6336c', '#a8622a', '#4263eb', '#087f5b', '#c92a2a', '#6741d9'];
function colour(p) {
  if (!p) return '';
  if (COLOURS[p]) return COLOURS[p];
  const i = ((D && D.projects) || []).indexOf(p);
  return SPARE[(i < 0 ? 0 : i) % SPARE.length];
}

/* ------------------------------------------------ dates */
const dateOf = k => new Date(k + 'T12:00:00Z');
const fmt = k => dateOf(k).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }).replace(',', '');
const fmtLong = k => dateOf(k).toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).replace(',', '');
function addDays(k, n) { const d = dateOf(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function nextMonday(k) { const dow = (dateOf(k).getUTCDay() + 6) % 7; return addDays(k, 7 - dow); }
const today = () => (D && D.today) || new Date().toISOString().slice(0, 10);

/* ------------------------------------------------ talking to the sheet */
const BUSY_WORDS = ['Got it, on it…', 'Asking the spreadsheet nicely…', 'Nearly there…', 'Google is thinking. It does that sometimes…', 'Still going, thanks for waiting…'];
let busyN = 0, busyEl = null, busyTimer = null;
function showBusy() {
  busyN++;
  if (busyEl) return;
  const word = el('span', { text: BUSY_WORDS[0] });
  busyEl = el('div', { class: 'busy', role: 'status', 'aria-live': 'polite' }, [el('i', { class: 'trail' }), el('div', { class: 'pill' }, [el('span', { class: 'leaf', text: '💧', 'aria-hidden': 'true' }), word])]);
  document.body.append(busyEl);
  let i = 0;
  busyTimer = setInterval(() => { i = Math.min(i + 1, BUSY_WORDS.length - 1); word.textContent = BUSY_WORDS[i]; }, 2600);
}
function hideBusy() {
  busyN = Math.max(0, busyN - 1);
  if (busyN || !busyEl) return;
  clearInterval(busyTimer); busyEl.remove(); busyEl = null;
}
function call(fn, args, ok, bad) {
  showBusy();
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: [KEY].concat(args || []) }) })
    .then(r => r.json())
    .then(res => { hideBusy(); if (!res || res.ok !== true) throw new Error((res && res.error) || 'Something went wrong. Please reload the page.'); ok(res.result); })
    .catch(e => { if (busyEl && busyN) hideBusy(); if (e.message === 'key') { KEY = ''; render(); return; } (bad || fail)(e); });
}
function take(d) {
  D = d;
  try { localStorage.setItem(PFX + 'Data2', JSON.stringify(d)); } catch (e) {}
  // Don't redraw under Dan's fingers: an open editor or snooze picker keeps what he has typed.
  if (editFor || snoozeFor) return;
  render();
}
let lastLoad = 0;
function load(force) { lastLoad = Date.now(); call('load', [force === true], take); }
/** Show the change at once, then save it. Only the newest answer is drawn, so quick taps don't flicker back. */
let pending = 0;
function act(fn, args, change, msg) {
  if (change) { change(); render(); }
  if (msg) toast(msg);
  pending++;
  call(fn, args, d => { pending--; if (!pending) take(d); }, e => { pending--; fail(e); load(); });
}
function fail(err) { const n = el('div', { class: 'error', role: 'alert', text: (err && err.message) || String(err) }); app.prepend(n); window.scrollTo(0, 0); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const n = el('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(n);
  setTimeout(() => n.remove(), 3500);
}
const byId = id => ((D && D.tasks) || []).find(t => t.id === id);

/* ------------------------------------------------ icons (line style, drawn here so nothing is fetched) */
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  plus: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  plan: '<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="10" y="4" width="5" height="11" rx="1.2"/><rect x="17" y="4" width="4" height="7" rx="1.2"/>',
  sort: '<path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/>',
  list: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  swipe: '<path d="M4 6h16M7 3L4 6l3 3M17 3l3 3-3 3"/><path d="M10 21v-8.5a1.6 1.6 0 0 1 3.2 0V16l3 .6a2 2 0 0 1 1.6 2V21"/>',

    p.style.display = open ? '' : 'none';
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
  } }, [L('info', 'Help')]);
  return el('div', { class: 'stack', style: 'gap:6px' }, [b, p]);
}
let folds = { on: true, off: false, done: false, watch: false, backlog: false, homeDone: false };
try { folds = Object.assign(folds, JSON.parse(localStorage.getItem(PFX + 'Folds') || '{}')); } catch (e) {}
function foldSection(key, title, count, kids, help) {
  const det = el('details', { class: 'fold', open: folds[key] }, [
    el('summary', {}, [el('h2', { text: title }), el('span', { class: 'cnt', text: String(count) })]),
    el('div', { class: 'fold-body' }, [help ? helpNote(help) : ''].concat(kids)),
  ]);
  det.addEventListener('toggle', () => { folds[key] = det.open; try { localStorage.setItem(PFX + 'Folds', JSON.stringify(folds)); } catch (e) {} });
  return det;
}
const none = txt => el('p', { class: 'none', style: 'margin:0', text: txt });

/* Home: the tasks on the list, Coming up, and how the month is tracking */
function renderHome() {
  const kids = [navBar(), el('header', {}, [
    el('div', { class: 'eyebrow', text: 'LightRain · ' + fmtLong(today()) }),
    el('h1', {}, ['Hello ' + (D.name || 'Dan') + '. ', el('em', { text: 'Here’s your list.' })]),
  ])];
  const open = sorted(D.tasks.filter(t => isOpen(t) && bucket(t) === 'on'));
  const part = [el('div', { class: 'part-head' }, [el('h2', { text: 'On your list' })])];
  if (open.length) {
    part.push(el('div', { class: 'view-row' }, [sortPicker(), viewToggle()]));
    part.push(el('div', { class: 'legend' }, [
      el('span', {}, [ico('person'), 'Task']),
      el('span', {}, [el('span', { class: 'lt' }, [ico('person')]), 'Ask (nice to have)']),
    ]));
    const cards = open.map(t => card(t, 'home'));
    part.push(deckMode ? deckView(cards) : el('div', { class: 'stack', style: 'gap:14px' }, cards));
  } else part.push(none('Nothing on your list. Put some on from Planning, or add new ones.'));
  kids.push(el('section', { class: 'part' }, part));
  const doneWeek = sorted(D.tasks.filter(t => doneSince(t, 7)));
  if (doneWeek.length) kids.push(foldSection('homeDone', 'Done this week', doneWeek.length, doneWeek.map(t => card(t, 'home'))));

  const coming = D.tasks.filter(t => t.feature && isOpen(t) && (t.due || t.asap)).sort((a, b) => ((a.asap ? '0' : a.due) < (b.asap ? '0' : b.due) ? -1 : 1));
  if (coming.length) {
    kids.push(el('section', {}, [el('h2', { text: 'Coming up' }), el('ul', { class: 'gist' }, coming.map(t => el('li', {}, [
      el('span', { class: 'k' + (t.asap || t.due < today() ? ' late' : ''), text: t.asap ? 'ASAP' : fmt(t.due) }),
      el('span', { class: 'v' }, [el('b', { text: t.header }), t.project ? el('span', { class: 'small', text: ' · ' + t.project }) : '']),
    ])))]));
  }
  kids.push(tracking());
  kids.push(el('section', { class: 'inline' }, [
    el('button', { class: 'btn ghost', type: 'button', text: 'Planning', onclick: () => go('plan') }),
    el('button', { class: 'switch', type: 'button', text: 'Refresh from the sheet', onclick: () => load(true) }),
  ]));
  app.replaceChildren(...kids);
}

/** The last 30 days, by project: done out of done plus what is still open on the list or the watch list. */
function tracking() {
  const rows = (D.projects || []).map(p => {
    const mine = D.tasks.filter(t => t.project === p);
    const done = mine.filter(t => doneSince(t, 30)).length;
    const open = mine.filter(t => isOpen(t) && (t.list === 'on' || t.list === 'watch')).length;
    return { p, done, total: done + open };
  }).filter(r => r.total);
  const all = rows.reduce((a, r) => ({ done: a.done + r.done, total: a.total + r.total }), { done: 0, total: 0 });
  const sec = [el('h2', { text: 'How you’re tracking this month' }),
    el('p', { class: 'small', style: 'margin:0 0 12px', text: all.done + ' done in the last 30 days, out of ' + all.total + ' on your list or watch list. Updates every day.' })];
  if (!rows.length) sec.push(none('Nothing to show yet.'));
  rows.forEach(r => sec.push(el('div', { class: 'bar-row', style: '--wc:' + (colour(r.p) || 'var(--accent)') }, [
    el('span', { class: 'nm' }, [el('i'), r.p]),
    el('div', { class: 'track', role: 'img', 'aria-label': r.p + ': ' + r.done + ' of ' + r.total + ' done' }, [el('div', { class: 'fill', style: 'width:' + Math.round(100 * r.done / r.total) + '%' })]),
    el('span', { class: 'small', text: r.done + ' of ' + r.total + ' done' }),
  ])));
  return el('section', { class: 'stack', style: 'gap:8px' }, sec);
}

/* Planning: the overview, then every bucket */
function renderPlan() {
  const T = D.tasks;
  const open = T.filter(isOpen);
  const stats = [
    ['Done this month', T.filter(t => doneSince(t, 30)).length],
    ['Under way', open.filter(t => t.status === 'progress').length],
    ['Not started', open.filter(t => t.status === 'open' && !t.rest).length],
    ['Snoozed', open.filter(t => t.rest).length],
    ['Can’t this month (back burner)', T.filter(t => t.status === 'backburner').length],
  ];
  const kids = [navBar(), el('header', {}, [el('div', { class: 'eyebrow', text: 'LightRain · Planning' }), el('h1', {}, ['Where things ', el('em', { text: 'stand' })])]),
    el('div', { class: 'stats' }, stats.map(([l, n]) => el('div', { class: 'stat' }, [el('b', { text: String(n) }), el('span', { text: l })]))),
    sortPicker()];
  const inB = b => sorted(T.filter(t => bucket(t) === b));
  const doneList = inB('done');
  if (sortBy === 'default') doneList.sort((a, b) => (b.doneOn || '') < (a.doneOn || '') ? -1 : (b.doneOn || '') > (a.doneOn || '') ? 1 : 0);
  const sec = (key, title, list, empty, help) => foldSection(key, title, list.length, list.length ? list.map(t => card(t, 'plan')) : [none(empty)], help);
  kids.push(sec('on', 'On the list', inB('on'), 'Nothing on the list.', 'What shows on your Home page. Tasks you haven’t placed yourself land here when they are under way, urgent, new this week or due within two weeks.'));
  kids.push(sec('off', 'Not on the list', inB('off'), 'Nothing waiting here.', 'Open tasks you are not working on now, plus anything snoozed (it goes back where it was on its date).'));
  kids.push(sec('done', 'Done', doneList, 'Nothing finished yet.', 'Finished tasks, newest first, and anything on the back burner. Bring any of them back if you need to.'));
  kids.push(sec('watch', 'Watch list', inB('watch'), 'Nothing on the watch list.', 'Things to keep an eye on without having them on your Home page.'));
  kids.push(sec('backlog', 'Backlog', inB('backlog'), 'The backlog is empty.', 'Parked for later. Move them back onto the list when it is their turn.'));
  kids.push(el('section', { class: 'inline' }, [el('button', { class: 'switch', type: 'button', text: 'Refresh from the sheet', onclick: () => load(true) })]));
  app.replaceChildren(...kids);
}

/* Add: one or more tasks or asks at a time */
function blankRow() { return { header: '', text: '', project: '', due: '', link: '', linkText: '', kind: 'task' }; }
function renderAdd() {
  if (!addRows.length) addRows = [blankRow()];
  const kids = [navBar(), el('header', {}, [
    el('h1', {}, ['Add ', el('em', { text: 'tasks or asks' })]),
    el('p', { class: 'muted', style: 'margin:8px 0 0', text: 'A short header in two or three words, then as much description as you like. New ones go straight on your list.' }),
  ])];
  addRows.forEach((row, i) => {
    const bind = (n, k) => { n.value = row[k]; n.addEventListener('input', () => { row[k] = n.value; }); n.addEventListener('change', () => { row[k] = n.value; }); return n; };
    const hd = bind(el('input', { id: 'hd-' + i, class: 'hd', maxlength: '60', placeholder: 'e.g. Budget October' }), 'header');
    const tx = bind(el('textarea', { id: 'tx-' + i, rows: 2, placeholder: 'What it involves (optional)' }), 'text');
    const du = bind(el('input', { id: 'du-' + i, type: 'date' }), 'due');
    const pj = bind(projectSelect('pj-' + i, row.project), 'project');
    const ln = bind(el('input', { id: 'ln-' + i, type: 'url', placeholder: 'https://…' }), 'link');
    const lt = bind(el('input', { id: 'lt-' + i, maxlength: '80', placeholder: 'What it is, e.g. Draft pack' }), 'linkText');
    kids.push(el('section', { class: 'addrow', 'aria-label': 'New task ' + (i + 1) }, [
      el('div', { class: 'field' }, [el('label', { for: 'hd-' + i, text: 'Header (two or three words)' }), hd]),
      el('div', { class: 'field' }, [el('label', { for: 'tx-' + i, text: 'Description' }), tx]),
      el('div', { class: 'grid2' }, [
        el('div', { class: 'field' }, [el('label', { for: 'du-' + i, text: 'Due date (optional)' }), du]),
        el('div', { class: 'field' }, [el('label', { for: 'pj-' + i, text: 'Project' }), pj]),
      ]),
      el('div', { class: 'grid2' }, [
        el('div', { class: 'field' }, [el('label', { for: 'ln-' + i, text: 'Link (optional)' }), ln]),
        el('div', { class: 'field' }, [el('label', { for: 'lt-' + i, text: 'Link label (optional)' }), lt]),
      ]),
      kindToggle(() => row.kind, v => { row.kind = v; }),
      addRows.length > 1 ? el('button', { class: 'switch', type: 'button', style: 'justify-self:start', text: 'Remove this one', onclick: () => { addRows.splice(i, 1); renderAdd(); } }) : '',
    ]));
  });
  kids.push(el('button', { class: 'plus', type: 'button', text: '＋  Add another', onclick: () => { addRows.push(blankRow()); renderAdd(); setTimeout(() => { const n = document.getElementById('hd-' + (addRows.length - 1)); if (n) n.focus(); }, 0); } }));
  const saveBtn = el('button', { class: 'btn', type: 'button', text: 'Save', onclick: () => {
    const rows = addRows.filter(r => r.header.trim() || r.text.trim());
    if (!rows.length) { fail(new Error('Nothing to save yet. Give it a header.')); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    call('add', [rows], d => { addRows = [blankRow()]; take(d); toast(rows.length === 1 ? 'Saved. It’s on your list.' : 'Saved ' + rows.length + '. They’re on your list.'); },
      e => { saveBtn.disabled = false; saveBtn.textContent = 'Save'; fail(e); });
  } });
  kids.push(el('div', {}, [saveBtn]));
  app.replaceChildren(...kids);
}

/* ------------------------------------------------ start */
render();
if (KEY) load();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && KEY && Date.now() - lastLoad > 120000 && !editFor && !snoozeFor && VIEW !== 'add') load(); });
</script>
